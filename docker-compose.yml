version: '3.8'

services:
  # ---------------------------------------
  # 1. FRONTEND (Nginx Serveur Web)
  # ---------------------------------------
  frontend:
    build:
      context: ./DigiAlert.Web
      dockerfile: Dockerfile
    container_name: digialert-frontend
    ports:
      - "5173:80" 
    depends_on:
      - backend

  # ---------------------------------------
  # 2. BACKEND (ASP.NET Core / C# compilé)
  # ---------------------------------------
  backend:
    build:
      context: ./DigiAlert.Api
      dockerfile: Dockerfile
    container_name: digialert-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=digialert_db;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_SECRET}
      - Brevo__ApiKey=${BREVO_API_KEY}
      - Brevo__SenderEmail=${BREVO_SENDER_EMAIL}
      - Brevo__SenderName=${BREVO_SENDER_NAME}
      - FrontendUrl=${FRONTEND_URL}
    depends_on:
      - db

  # ---------------------------------------
  # 3. BASE DE DONNÉES (PostgreSQL)
  # ---------------------------------------
  db:
    image: postgres:15-alpine
    container_name: digialert-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-1324}
      - POSTGRES_DB=digialert_db
    # Le port 5434 reste caché pour protéger la base de données !
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: