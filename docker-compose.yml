version: '3.8'

services:
  # ---------------------------------------
  # 1. FRONTEND (React / Vite)
  # ---------------------------------------
  frontend:
    image: node:20-alpine
    container_name: digialert-frontend
    working_dir: /app
    volumes:
      - ./DigiAlert.Web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://backend:5294
    depends_on:
      - backend

  # ---------------------------------------
  # 2. BACKEND (ASP.NET Core / C#)
  # ---------------------------------------
  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: digialert-backend
    working_dir: /app
    volumes:
      - ./DigiAlert.Api:/app
      - /app/bin 
      - /app/obj 
    ports:
      - "5294:5294"
    command: dotnet watch run --urls "http://0.0.0.0:5294"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # 🚀 MAGIE .NET : Cette variable remplace automatiquement la ConnectionString de ton appsettings.json !
      # On utilise "Host=db" car c'est le nom du conteneur Postgres ci-dessous.
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=digialert_db;Username=postgres;Password=1324
    depends_on:
      - db

  # ---------------------------------------
  # 3. BASE DE DONNÉES (PostgreSQL)
  # ---------------------------------------
  db:
    image: postgres:15-alpine
    container_name: digialert-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1324
      - POSTGRES_DB=digialert_db
    ports:
      # ⚠️ On l'expose sur 5434 sur ton PC pour éviter les conflits si tu as déjà un Postgres qui tourne sur ton Debian (5432).
      - "5434:5432"
    volumes:
      # Pour ne pas perdre les données quand on éteint Docker
      - pgdata:/var/lib/postgresql/data

# Déclaration du volume persistant
volumes:
  pgdata: